<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>생물 크기 비교</title>
<style>
body{
    font-family:Arial;
    max-width:700px;
    margin:40px auto;
    padding:20px;
}
input{
    width:100%;
    padding:10px;
    margin:10px 0;
}
button{
    width:100%;
    padding:12px;
    font-size:18px;
}
#result{
    margin-top:20px;
    font-size:20px;
}
</style>
</head>
<body>

<h1>🦒 생물 크기 비교</h1>

<input id="a" placeholder="첫 번째 생물">
<input id="b" placeholder="두 번째 생물">

<button onclick="compare()">비교하기</button>

<div id="result"></div>

<script>

async function getLength(name){

const query=`
SELECT ?length WHERE{
?item rdfs:label "${name}"@ko.
?item wdt:P2043 ?length.
}
LIMIT 1
`;

const url="https://query.wikidata.org/sparql?format=json&query="+encodeURIComponent(query);

const res=await fetch(url,{
headers:{
'Accept':'application/sparql-results+json'
}
});

const data=await res.json();

if(data.results.bindings.length==0){
return null;
}

return parseFloat(data.results.bindings[0].length.value);

}

async function compare(){

const x=document.getElementById("a").value;
const y=document.getElementById("b").value;

document.getElementById("result").innerHTML="검색 중...";

const ax=await getLength(x);
const ay=await getLength(y);

if(ax==null||ay==null){
document.getElementById("result").innerHTML=
"한 생물 이상의 크기 데이터를 찾지 못했습니다.";
return;
}

let html="";

if(ax>ay){

html=`
<h2>${x}가 더 큽니다.</h2>
${x}: ${ax} m<br>
${y}: ${ay} m<br><br>
약 ${(ax/ay).toFixed(2)}배 큽니다.
`;

}else if(ay>ax){

html=`
<h2>${y}가 더 큽니다.</h2>
${x}: ${ax} m<br>
${y}: ${ay} m<br><br>
약 ${(ay/ax).toFixed(2)}배 큽니다.
`;

}else{

html="두 생물의 크기가 같습니다.";

}

document.getElementById("result").innerHTML=html;

}

</script>

</body>
</html>
