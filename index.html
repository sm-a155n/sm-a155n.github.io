<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대규모 생물 크기 비교</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f6f8;
    }

    .box {
      width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    button {
      padding: 12px;
      margin: 10px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }

    canvas {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>📊 확장 생물 크기 비교 (대량 데이터)</h1>

<div class="box">
  <p>100종 이상의 생물 데이터를 시각화합니다</p>
  <button onclick="drawChart()">그래프 생성</button>

  <canvas id="myChart"></canvas>
</div>

<script>
// 🧬 확장된 생물 데이터 (약 100개)
const labels = [
  "개미", "벌", "모기", "나비", "메뚜기",
  "개구리", "도마뱀", "뱀", "거북이", "악어",
  "고양이", "강아지", "토끼", "여우", "늑대",
  "사슴", "곰", "호랑이", "사자", "치타",
  "코끼리", "기린", "얼룩말", "하마", "코뿔소",
  "독수리", "참새", "비둘기", "까치", "부엉이",
  "펭귄", "백조", "오리", "앵무새", "까마귀",
  "돌고래", "상어", "고래", "해파리", "문어",
  "게", "새우", "불가사리", "산호", "물고기",
  "사람", "아기", "청소년", "성인", "노인",
  "나무개미", "장수풍뎅이", "사슴벌레", "무당벌레", "바퀴벌레",
  "사막여우", "북극곰", "코알라", "캥거루", "판다",
  "고릴라", "침팬지", "오랑우탄", "하이에나", "치와와",
  "세인트버나드", "말", "당나귀", "낙타", "알파카",
  "타조", "에뮤", "플라밍고", "황새", "매",
  "고래상어", "백상아리", "청새치", "가오리", "복어",
  "해마", "열대어", "금붕어", "잉어", "메기",
  "전갈", "지네", "달팽이", "민달팽이", "지렁이"
];

const values = [
  0.5, 1, 0.4, 5, 4,
  8, 25, 80, 30, 400,
  50, 60, 40, 70, 90,
  120, 250, 300, 250, 150,
  3000, 5000, 250, 150, 300,
  70, 15, 30, 35, 45,
  70, 120, 50, 40, 60,
  200, 600, 25000, 20, 100,
  10, 6, 30, 50, 15,
  170, 50, 140, 165, 80,
  0.3, 6, 5, 1, 3,
  50, 280, 90, 150, 160,
  180, 120, 130, 140, 25,
  70, 250, 200, 300, 90,
  150, 180, 140, 120, 110,
  250, 300, 100, 120, 80,
  800, 600, 500, 400, 200,
  30, 15, 10, 12, 30,
  25, 8, 2, 3, 5
];

let chart;

function drawChart() {
  const ctx = document.getElementById('myChart');

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: '생물 크기 (cm)',
        data: values,
        backgroundColor: '#4CAF50'
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
}
</script>

</body>
</html>
