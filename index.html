<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>생물 크기 비교 그래프</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f6f8;
    }

    .box {
      width: 850px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }

    button:hover {
      background: #45a049;
    }

    canvas {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>📊 생물 크기 비교 </h1>

<div class="box">
  <p> </p>

  <button onclick="showAll()">전체 보기</button>
  <button onclick="showTop10()">TOP 10 보기</button>

  <canvas id="myChart"></canvas>
</div>

<script>
// 🧬 전체 데이터
const fullLabels = [
  "개미","벌","모기","나비","메뚜기",
  "개구리","도마뱀","뱀","거북이","악어",
  "고양이","강아지","여우","늑대","사슴",
  "호랑이","사자","치타","곰",
  "코끼리","기린",
  "독수리","펭귄","참새",
  "돌고래","상어","고래",
  "사람","아기","청소년",
  "문어","해파리","게"
];

const fullValues = [
  0.5,1,0.4,5,4,
  8,25,80,30,400,
  50,60,70,90,120,
  300,250,150,250,
  3000,5000,
  70,70,15,
  200,600,25000,
  170,50,140,
  100,20,10
];

// 📊 현재 표시 데이터
let labels = [...fullLabels];
let values = [...fullValues];

let chart;

// 📊 차트 생성 함수
function createChart() {
  const ctx = document.getElementById("myChart");

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        label: "생물 크기 (cm)",
        data: values,
        backgroundColor: "#4CAF50"
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          type: "logarithmic", // ⭐ 핵심 (큰 값 문제 해결)
        }
      }
    }
  });
}

// 📌 전체 보기
function showAll() {
  labels = [...fullLabels];
  values = [...fullValues];
  createChart();
}

// 📌 TOP 10 보기
function showTop10() {
  const sorted = fullLabels
    .map((name, i) => ({
      name,
      value: fullValues[i]
    }))
    .sort((a, b) => b.value - a.value)
    .slice(0, 10);

  labels = sorted.map(x => x.name);
  values = sorted.map(x => x.value);

  createChart();
}

// 🚀 처음 실행
createChart();
</script>

</body>
</html>
