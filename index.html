<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>생물 크기 그래프</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #f4f6f8;
    }

    .box {
      width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input {
      margin: 5px;
      padding: 8px;
      width: 80%;
    }

    button {
      padding: 10px;
      margin: 5px;
    }
  </style>
</head>

<body>

<h1>📊 생물 크기 비교</h1>

<div class="box">
  <input id="name" placeholder="생물 이름">
  <input id="size" type="number" placeholder="크기 (cm)">

  <br>
  <button onclick="addData()">추가</button>
  <button onclick="updateChart()">그래프 보기</button>

  <canvas id="myChart"></canvas>
</div>

<script>
let labels = [];
let values = [];

const ctx = document.getElementById('myChart');

const chart = new Chart(ctx, {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: '크기 (cm)',
      data: values,
      backgroundColor: '#4CAF50'
    }]
  }
});

function addData() {
  const name = document.getElementById("name").value;
  const size = parseFloat(document.getElementById("size").value);

  if (!name || isNaN(size)) {
    alert("입력 오류");
    return;
  }

  labels.push(name);
  values.push(size);

  document.getElementById("name").value = "";
  document.getElementById("size").value = "";
}

function updateChart() {
  chart.update();
}
</script>

</body>
</html>
