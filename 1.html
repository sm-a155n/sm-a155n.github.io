<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>생물 크기 비교 (이미지 버전)</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      overflow-x: auto;
    }

    h1 {
      text-align: center;
      padding: 20px;
    }

    .hint {
      text-align: center;
      opacity: 0.7;
      margin-bottom: 20px;
    }

    .world {
      display: flex;
      align-items: flex-end;
      gap: 80px;
      padding: 60px;
      min-width: max-content;
    }

    .creature {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* 🔥 이미지가 핵심 */
    .creature img {
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
      transition: transform 0.3s;
    }

    .name {
      margin-top: 10px;
      font-size: 14px;
    }

    .size {
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<h1>📏 생물 크기 비교 (이미지)</h1>
<div class="hint">스크롤해서 크기를 비교하세요</div>

<div class="world" id="world"></div>

<script>

// 🧬 생물 + 이미지 + 크기 (cm)
const data = [
  {
    name: "개미",
    size: 0.5,
    img: "https://upload.wikimedia.org/wikipedia/commons/2/29/Ant_working.jpg"
  },
  {
    name: "벌",
    size: 1,
    img: "https://upload.wikimedia.org/wikipedia/commons/7/7e/Bee_apis.jpg"
  },
  {
    name: "개구리",
    size: 8,
    img: "https://upload.wikimedia.org/wikipedia/commons/5/5a/Frog_on_lily_pad.jpg"
  },
  {
    name: "고양이",
    size: 50,
    img: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg"
  },
  {
    name: "강아지",
    size: 60,
    img: "https://upload.wikimedia.org/wikipedia/commons/6/6e/Golde33443.jpg"
  },
  {
    name: "독수리",
    size: 70,
    img: "https://upload.wikimedia.org/wikipedia/commons/1/1a/Bald_Eagle_Portrait.jpg"
  },
  {
    name: "사람",
    size: 170,
    img: "https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg"
  },
  {
    name: "호랑이",
    size: 300,
    img: "https://upload.wikimedia.org/wikipedia/commons/5/56/Tiger.50.jpg"
  },
  {
    name: "코끼리",
    size: 3000,
    img: "https://upload.wikimedia.org/wikipedia/commons/3/37/African_Bush_Elephant.jpg"
  },
  {
    name: "기린",
    size: 5000,
    img: "https://upload.wikimedia.org/wikipedia/commons/9/9f/Giraffe_standing.jpg"
  },
  {
    name: "상어",
    size: 600,
    img: "https://upload.wikimedia.org/wikipedia/commons/5/56/White_shark.jpg"
  },
  {
    name: "고래",
    size: 25000,
    img: "https://upload.wikimedia.org/wikipedia/commons/3/3b/Blue_Whale_001_body_whale.jpg"
  }
];

// 🔥 스케일 (핵심)
function getSize(size) {
  return Math.sqrt(size) * 25; // 너무 크면 줄이고 작으면 키움
}

const world = document.getElementById("world");

data.forEach(item => {
  const el = document.createElement("div");
  el.className = "creature";

  const img = document.createElement("img");
  const size = getSize(item.size);

  img.src = item.img;
  img.style.width = size + "px";
  img.style.height = size + "px";

  const name = document.createElement("div");
  name.className = "name";
  name.innerText = item.name;

  const s = document.createElement("div");
  s.className = "size";
  s.innerText = item.size + " cm";

  el.appendChild(img);
  el.appendChild(name);
  el.appendChild(s);

  world.appendChild(el);
});
</script>

</body>
</html>
