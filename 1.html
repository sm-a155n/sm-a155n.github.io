<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미시 세계 월드 (줌 + 드래그)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050811;
            font-family: 'Malgun Gothic', sans-serif;
            color: #fff;
            user-select: none;
        }

        h1 {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            margin: 0;
            background: rgba(5, 8, 17, 0.85);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1.4rem;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid rgba(0, 255, 204, 0.2);
            letter-spacing: -0.5px;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(5, 8, 17, 0.85);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            pointer-events: none;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <h1>🦠 미시 세계 월드 (줌 + 드래그)</h1>
    
    <div id="canvas-container">
        <!-- 깨질 염려가 없는 HTML5 캔버스를 사용합니다 -->
        <canvas id="worldCanvas"></canvas>
    </div>

    <div class="instructions">🖱️ 마우스 휠: 줌 인/아웃 | 🖐️ 드래그: 화면 이동</div>

    <script>
        const canvas = document.getElementById('worldCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // 캔버스 크기를 화면에 맞춤
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        }

        // 변환 상태 관리 variables
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        // 초기 위치를 화면 중앙으로 설정
        offsetX = window.innerWidth / 2;
        offsetY = window.innerHeight / 2;

        // [핵심] 미시 세계 느낌의 그래픽을 실시간으로 그리는 함수
        function draw() {
            // 1. 화면 지우기
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // 2. 드래그 및 줌 매트릭스 적용
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // --- 미시 세계/세포 그래픽 그리기 시작 ---
            // 배경 격자(Grid)
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
            ctx.lineWidth = 1;
            const gridCount = 20;
            const gridSize = 100;
            for(let i = -gridCount; i <= gridCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, -gridCount * gridSize);
                ctx.lineTo(i * gridSize, gridCount * gridSize);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(-gridCount * gridSize, i * gridSize);
                ctx.lineTo(gridCount * gridSize, i * gridSize);
                ctx.stroke();
            }

            // 큰 세포벽 (가운데 원)
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.4)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 300, 0, Math.PI * 2);
            ctx.stroke();

            // 세포핵 (붉은 중심부)
            let gradient = ctx.createRadialGradient(0, 0, 10, 0, 0, 80);
            gradient.addColorStop(0, 'rgba(255, 0, 85, 1)');
            gradient.addColorStop(0.8, 'rgba(255, 0, 85, 0.5)');
            gradient.addColorStop(1, 'rgba(255, 0, 85, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 80, 0, Math.PI * 2);
            ctx.fill();

            // 주변 미토콘드리아 및 미생물 표현들
            drawOrganelle(-120, -100, 35, '#00ffff');
            drawOrganelle(140, 120, 45, '#ffcc00');
            drawOrganelle(160, -140, 25, '#00ff66');
            drawOrganelle(-150, 150, 30, '#a100ff');

            // 아주 작은 미세 입자들 50개 생성
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            for (let i = 0; i < 50; i++) {
                let x = Math.sin(i * 9) * 260;
                let y = Math.cos(i * 3) * 260;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            // --- 그래픽 그리기 끝 ---

            ctx.restore();
        }

        // 세포 소기관을 그리는 보조 함수
        function drawOrganelle(x, y, r, color) {
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(x, y, r + 5, 0, Math.PI * 2);
            ctx.stroke();
        }

        // 1. 마우스 드래그 이벤트
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            offsetX = e.clientX - startX;
            offsetY = e.clientY - startY;
            draw();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // 모바일 터치 지원
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - offsetX;
                startY = e.touches[0].clientY - offsetY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            offsetX = e.touches[0].clientX - startX;
            offsetY = e.touches[0].clientY - startY;
            draw();
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // 2. 마우스 휠 줌 기능 (마우스 커서 중심 줌)
        container.addEventListener('wheel', (e) => {
            e.preventDefault();

            const zoomFactor = 1.1;
            let newScale = scale;

            if (e.deltaY < 0) {
                newScale *= zoomFactor;
            } else {
                newScale /= zoomFactor;
            }

            // 최소 0.4배, 최대 25배 제한
            newScale = Math.min(Math.max(0.4, newScale), 25);

            // 마우스 커서 위치 기준으로 중심축 조정 계산
            offsetX = e.clientX - (e.clientX - offsetX) * (newScale / scale);
            offsetY = e.clientY - (e.clientY - offsetY) * (newScale / scale);
            scale = newScale;

            draw();
        }, { passive: false });

        // 초기화 및 창 크기 변경 대응
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
