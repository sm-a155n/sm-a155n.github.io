<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>미시 세계 월드</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #0b1020, #000);
      font-family: Arial;
      color: white;
      cursor: grab;
    }

    body:active {
      cursor: grabbing;
    }

    h1 {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      opacity: 0.8;
      z-index: 10;
    }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      gap: 250px;
      padding-left: 300px;
      transform-origin: 0 50%;
      will-change: transform;
    }

    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .circle {
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #22c55e, #065f46);
      box-shadow: 0 0 20px rgba(34,197,94,0.5);
    }

    .name {
      margin-top: 10px;
      font-size: 14px;
    }

    .size {
      font-size: 11px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<h1>🦠 미시 세계 월드 (휠로 줌)</h1>

<div id="world"></div>

<script>

// 🧬 미시 세계 데이터 (cm 기준 감각값)
const data = [
  { name: "세포", size: 10 },
  { name: "박테리아", size: 1 },
  { name: "DNA", size: 0.1 },
  { name: "단백질", size: 0.01 },
  { name: "바이러스", size: 0.001 },
  { name: "원자", size: 0.0001 },
  { name: "전자", size: 0.00001 }
];

const world = document.getElementById("world");

// 🔥 로그 스케일 (핵심)
function scale(size) {
  return Math.log10(size + 1e-10) * -80;
}

// 🌍 생성
data.forEach(d => {
  const el = document.createElement("div");
  el.className = "item";

  const circle = document.createElement("div");
  circle.className = "circle";

  const s = Math.abs(scale(d.size)) + 20;

  circle.style.width = s + "px";
  circle.style.height = s + "px";

  const name = document.createElement("div");
  name.className = "name";
  name.innerText = d.name;

  const size = document.createElement("div");
  size.className = "size";
  size.innerText = d.size + " cm";

  el.appendChild(circle);
  el.appendChild(name);
  el.appendChild(size);

  world.appendChild(el);
});

// 🎯 줌 시스템 (휠로 세계 이동)
let zoom = 1;
let targetZoom = 1;

document.addEventListener("wheel", e => {
  targetZoom += e.deltaY * -0.001;
  targetZoom = Math.min(Math.max(0.3, targetZoom), 4);
});

// 🧠 부드러운 줌 애니메이션
function animate() {
  zoom += (targetZoom - zoom) * 0.08;
  world.style.transform = `scale(${zoom})`;
  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
