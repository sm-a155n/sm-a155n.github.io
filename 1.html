<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>생물 크기 월드</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0b1020;
      font-family: Arial;
      color: white;
    }

    h1 {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      opacity: 0.8;
      z-index: 10;
    }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: flex-end;
      gap: 200px;
      padding-left: 200px;
      transition: transform 0.05s linear;
    }

    .creature {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .img {
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
    }

    .name {
      margin-top: 10px;
      font-size: 14px;
    }

    .size {
      font-size: 11px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<h1>📏 생물 크기 비교 (스크롤 / 드래그)</h1>

<div id="world"></div>

<script>

// 🧬 데이터
const data = [
  { name:"개미", size:0.5, img:"https://upload.wikimedia.org/wikipedia/commons/2/29/Ant_working.jpg" },
  { name:"벌", size:1, img:"https://upload.wikimedia.org/wikipedia/commons/7/7e/Bee_apis.jpg" },
  { name:"개구리", size:8, img:"https://upload.wikimedia.org/wikipedia/commons/5/5a/Frog_on_lily_pad.jpg" },
  { name:"고양이", size:50, img:"https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg" },
  { name:"강아지", size:60, img:"https://upload.wikimedia.org/wikipedia/commons/6/6e/Golde33443.jpg" },
  { name:"독수리", size:70, img:"https://upload.wikimedia.org/wikipedia/commons/1/1a/Bald_Eagle_Portrait.jpg" },
  { name:"사람", size:170, img:"https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg" },
  { name:"호랑이", size:300, img:"https://upload.wikimedia.org/wikipedia/commons/5/56/Tiger.50.jpg" },
  { name:"코끼리", size:3000, img:"https://upload.wikimedia.org/wikipedia/commons/3/37/African_Bush_Elephant.jpg" },
  { name:"기린", size:5000, img:"https://upload.wikimedia.org/wikipedia/commons/9/9f/Giraffe_standing.jpg" },
  { name:"상어", size:600, img:"https://upload.wikimedia.org/wikipedia/commons/5/56/White_shark.jpg" },
  { name:"고래", size:25000, img:"https://upload.wikimedia.org/wikipedia/commons/3/3b/Blue_Whale_001_body_whale.jpg" }
];

// 📏 스케일 (핵심)
function scale(size) {
  return Math.sqrt(size) * 15;
}

const world = document.getElementById("world");

// 🌍 생성
data.forEach(d => {
  const el = document.createElement("div");
  el.className = "creature";

  const img = document.createElement("img");
  const s = scale(d.size);

  img.src = d.img;
  img.className = "img";
  img.style.width = s + "px";
  img.style.height = s + "px";

  const name = document.createElement("div");
  name.className = "name";
  name.innerText = d.name;

  const size = document.createElement("div");
  size.className = "size";
  size.innerText = d.size + " cm";

  el.appendChild(img);
  el.appendChild(name);
  el.appendChild(size);

  world.appendChild(el);
});

// 🖱️ 드래그 이동 (Neal.fun 핵심 느낌)
let isDown = false;
let startX;
let offset = 0;

document.addEventListener("mousedown", e => {
  isDown = true;
  startX = e.clientX - offset;
});

document.addEventListener("mouseup", () => {
  isDown = false;
});

document.addEventListener("mousemove", e => {
  if (!isDown) return;
  offset = e.clientX - startX;
  world.style.transform = `translateX(${offset}px)`;
});
</script>

</body>
</html>
