<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미시 세계 월드 (줌 + 드래그)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Malgun Gothic', sans-serif;
            color: #fff;
            user-select: none;
        }

        h1 {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            margin: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.5rem;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            letter-spacing: -0.5px;
        }

        #world-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
            overflow: hidden;
        }

        #world-container:active {
            cursor: grabbing;
        }

        #micro-image {
            position: absolute;
            transform-origin: 0 0;
            transition: transform 0.08s ease-out;
            will-change: transform;
            /* 기본 이미지 크기 지정 */
            width: 1200px;
            height: 1200px;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 0.9rem;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>🦠 미시 세계 월드 (줌 + 드래그)</h1>
    
    <div id="world-container">
        <!-- 가상의 우주/미시세계 그래픽 이미지를 코드로 직접 내장 (외부 링크 X) -->
        <img id="micro-image" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1200' viewBox='0 0 1200 1200'><rect width='1200' height='1200' fill='%230b0f19'/><circle cx='600' cy='600' r='400' fill='none' stroke='%2300ffcc' stroke-width='4' opacity='0.3'/><circle cx='600' cy='600' r='200' fill='none' stroke='%2300ffcc' stroke-width='2' opacity='0.5'/><circle cx='600' cy='600' r='50' fill='%23ff0055' opacity='0.8'/><circle cx='450' cy='500' r='30' fill='%2300ffcc' opacity='0.7'/><circle cx='720' cy='700' r='45' fill='%2300ffff' opacity='0.6'/><circle cx='550' cy='750' r='25' fill='%23ffcc00' opacity='0.7'/><g stroke='%23fff' stroke-width='1' opacity='0.2'><line x1='0' y1='600' x2='1200' y2='600'/><line x1='600' y1='0' x2='600' y2='1200'/></g></svg>" alt="Micro World">
    </div>

    <div class="instructions">🖱️ 마우스 휠: 줌 인/아웃 | 🖐️ 드래그: 화면 이동</div>

    <script>
        const container = document.getElementById('world-container');
        const img = document.getElementById('micro-image');

        let scale = 1;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;
        let isPanning = false;

        // 중앙 정렬 함수
        function centerImage() {
            pointX = (window.innerWidth - img.offsetWidth * scale) / 2;
            pointY = (window.innerHeight - img.offsetHeight * scale) / 2;
            updateTransform();
        }

        function updateTransform() {
            img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        // 초기 실행 및 이미지 로드 확인
        if (img.complete) {
            centerImage();
        } else {
            img.onload = centerImage;
        }

        // 1. 드래그 기능
        container.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
            isPanning = true;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
        });

        // 터치 지원 (모바일)
        container.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) {
                isPanning = true;
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isPanning || e.touches.length !== 1) return;
            pointX = e.touches[0].clientX - startX;
            pointY = e.touches[0].clientY - startY;
            updateTransform();
        });

        window.addEventListener('touchend', () => { isPanning = false; });

        // 2. 줌 기능 (마우스 휠)
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            
            const xs = (e.clientX - pointX) / scale;
            const ys = (e.clientY - pointY) / scale;
            
            const delta = -e.deltaY;
            if (delta > 0) {
                scale *= 1.15;
            } else {
                scale /= 1.15;
            }
            
            scale = Math.min(Math.max(0.3, scale), 20);

            pointX = e.clientX - xs * scale;
            pointY = e.clientY - ys * scale;

            updateTransform();
        }, { passive: false });

        window.addEventListener('resize', centerImage);
    </script>
</body>
</html>
