<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고전 북리뷰 허브 (Classic Book Review)</title>
    <style>
        :root {
            --bg-color: #f5f4f0; /* 고전 느낌의 은은한 베이지 톤 배경 */
            --card-bg: #ffffff;
            --text-main: #1c1917;
            --text-muted: #78716c;
            --accent: #7c2d12; /* 고전 서적 느낌의 브라운 딥 컬러 */
            --accent-hover: #9a3412;
            --border: #e7e5e4;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            line-height: 1.6;
        }

        /* 헤더 영역 */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            margin-left: 20px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--accent);
        }

        /* 메인 히어로 배너 */
        .hero {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        .hero h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
            color: var(--accent);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* 책 리스트 그리드 레이아웃 */
        .book-grid {
            max-width: 1200px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* 책 카드 스타일 */
        .book-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        /* 가상 표지 영역 (Canvas 사용) */
        .cover-wrapper {
            width: 100%;
            height: 380px;
            overflow: hidden;
            background: #eee;
            position: relative;
        }

        .cover-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 카드 텍스트 내용 */
        .book-info {
            padding: 24px;
        }

        .book-tag {
            display: inline-block;
            background-color: #fff7ed;
            color: #c2410c;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid #ffedd5;
        }

        .book-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-author {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .rating {
            color: #f59e0b;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.95rem;
        }

        /* 푸터 */
        footer {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* 모달 (상세 리뷰 팝업창) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 600px;
            border-radius: 20px;
            padding: 30px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f5f5f4;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body h3 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .modal-review {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: #44403c;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <header>
        <div class="header-container">
            <a href="#" class="logo">🏛️ ClassicHub</a>
            <nav>
                <a href="#">홈</a>
                <a href="#">시대별 고전</a>
                <a href="#">명문장 보관함</a>
            </nav>
        </div>
    </header>

    <!-- 히어로 배너 -->
    <section class="hero">
        <h2>시간의 강을 견뎌낸 위대한 유산</h2>
        <p>인류의 깊은 지혜와 고뇌가 담긴 고전 명작 리뷰를 만나보세요.</p>
    </section>

    <!-- 책 리스트 그리드 -->
    <main class="book-grid" id="bookGrid">
        <!-- 자바스크립트로 고전 서적 카드가 자동 생성됩니다 -->
    </main>

    <!-- 푸터 -->
    <footer>
        <p>© 2026 ClassicHub. All rights reserved.</p>
    </footer>

    <!-- 상세 리뷰 모달창 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeBtn">&times;</button>
            <div class="modal-body" id="modalBody">
                <!-- 동적 내용 삽입 -->
            </div>
        </div>
    </div>

    <script>
        // 새로운 고전 도서 데이터 목록 (기존 도서 완전 제외)
        const books = [
            {
                title: "노인과 바다",
                author: "어니스트 헤밍웨이",
                tag: "세계 문학 / 미국",
                rating: "⭐️ 4.9",
                color: "#1e3a8a", /* 깊은 바다색 */
                accentColor: "#fef08a",
                review: "쿠바의 늙은 어부 산티아고의 거대한 청새치와의 사투, 그리고 상어 떼의 습격을 그린 헤밍웨이의 정점입니다. '인간은 파멸할지언정 패배하지 않는다'는 명제 아래, 가혹한 운명에 맞서 인간의 존엄성과 불굴의 의지를 간결하고 강렬한 문체로 보여주는 위대한 고전입니다."
            },
            {
                title: "데미안",
                author: "헤르만 헤세",
                tag: "성장 소설 / 독일",
                rating: "⭐️ 4.8",
                color: "#14532d", /* 고풍스러운 다크 그린 */
                accentColor: "#fde047",
                review: "싱클레어라는 한 소년이 안락한 세계를 깨고 나와 진정한 자아를 찾아가는 치열한 내면의 여정을 다룹니다. 신비로운 인물 '데미안'을 만나며 겪는 선과 악의 고뇌는 오늘날 방황하는 청춘들에게도 '알을 깨고 나오는 아픔과 성장의 가치'를 고스란히 전해줍니다."
            },
            {
                title: "위대한 개츠비",
                author: "F. 스콧 피츠제럴드",
                tag: "세계 문학 / 소설",
                rating: "⭐️ 4.7",
                color: "#451a03", /* 고급스러운 클래식 브라운 */
                accentColor: "#fcd34d",
                review: "1920년대 미국 물질문명의 황금기 속에서 피어난 한 남자의 맹목적이고도 비극적인 사랑을 그린 소설입니다. 화려함 뒤에 숨겨진 인간의 공허함과 아메리칸드림의 환멸을 피츠제럴드 특유의 아름답고 감각적인 문체로 날카롭게 포착해 낸 수작입니다."
            },
            {
                title: "오만과 편견",
                author: "제인 오스틴",
                tag: "영국 문학 / 로맨스",
                rating: "⭐️ 4.8",
                color: "#4d0727", /* 세련된 딥 버건디 */
                accentColor: "#fbcfe8",
                review: "엘리자베스의 '편견'과 다이시의 '오만'이 부딪히며 진정한 사랑을 깨달아가는 과정을 유쾌하고도 섬세하게 다룬 작품입니다. 단순한 연애 소설을 넘어 18세기 영국 상류층 사회의 계급과 결혼 제도를 날카로운 위트와 냉철한 시선으로 풍자하여 문학적 가치가 매우 높습니다."
            }
        ];

        const grid = document.getElementById('bookGrid');
        const overlay = document.getElementById('modalOverlay');
        const modalBody = document.getElementById('modalBody');
        const closeBtn = document.getElementById('closeBtn');

        // 메인 화면에 책 카드 렌더링
        books.forEach((book, index) => {
            const card = document.createElement('div');
            card.className = 'book-card';
            card.innerHTML = `
                <div class="cover-wrapper">
                    <canvas class="cover-canvas" id="canvas-${index}"></canvas>
                </div>
                <div class="book-info">
                    <span class="book-tag">${book.tag}</span>
                    <h3 class="book-title">${book.title}</h3>
                    <div class="book-author">${book.author} 저</div>
                    <div class="rating">${book.rating}</div>
                </div>
            `;
            
            card.addEventListener('click', () => openModal(book));
            grid.appendChild(card);

            // 고전 양장본 디자인 느낌으로 표지 그리기
            setTimeout(() => {
                drawBookCover(`canvas-${index}`, book);
            }, 10);
        });

        // 캔버스 기반 클래식 양장본 스타일 표지 렌더링 함수
        function drawBookCover(canvasId, bookData) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            canvas.width = 300;
            canvas.height = 380;

            // 1. 기본 표지 배경색
            ctx.fillStyle = bookData.color;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 책 등/입체 질감 음영
            let grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
            grad.addColorStop(0, 'rgba(0,0,0,0.3)');
            grad.addColorStop(0.04, 'rgba(255,255,255,0.08)');
            grad.addColorStop(0.08, 'rgba(0,0,0,0)');
            grad.addColorStop(0.96, 'rgba(0,0,0,0.2)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3. 고전 양장본 문양 사각 프레임 추가
            ctx.strokeStyle = bookData.accentColor;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.4;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
            ctx.strokeRect(25, 25, canvas.width - 50, canvas.height - 50);

            // 4. 중앙 디자인 데코 (다이아몬드 포인트)
            ctx.fillStyle = bookData.accentColor;
            ctx.beginPath();
            ctx.moveTo(canvas.width/2, 210);
            ctx.lineTo(canvas.width/2 + 25, 235);
            ctx.lineTo(canvas.width/2, 260);
            ctx.lineTo(canvas.width/2 - 25, 235);
            ctx.closePath();
            ctx.fill();

            // 5. 타이틀 매핑
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px "Malgun Gothic", serif';
            ctx.textAlign = 'center';
            
            const title = bookData.title;
            if(title.length > 6) {
                ctx.fillText(title.substring(0, 5), canvas.width/2, 115);
                ctx.fillText(title.substring(5), canvas.width/2, 150);
            } else {
                ctx.fillText(title, canvas.width/2, 130);
            }

            // 6. 작가 이름 매핑
            ctx.fillStyle = bookData.accentColor;
            ctx.font = 'italic 13px "Malgun Gothic", sans-serif';
            ctx.fillText(bookData.author, canvas.width/2, canvas.height - 65);
        }

        // 모달창 제어
        function openModal(book) {
            modalBody.innerHTML = `
                <span class="book-tag" style="margin-bottom:8px;">${book.tag}</span>
                <h3>${book.title}</h3>
                <div style="color:var(--text-muted); font-size:0.95rem; margin-bottom:15px;">저자: ${book.author} | 추천 평점: ${book.rating}</div>
                <div class="modal-review">
                    <h4 style="margin: 0 0 10px 0; font-size: 1.1rem; color: var(--accent);">🏛️ 작품 해설 및 서평</h4>
                    ${book.review}
                </div>
            `;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => {
            if(e.target === overlay) closeModal();
        });
    </script>
</body>
</html>
